[project]
name = "autonomous-futures-bot"
version = "0.1.0"
description = "Paper-safe autonomous research and futures trading platform"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.19.0",
    "binance-sdk-derivatives-trading-usds-futures==16.0.0",
    "cryptography==50.0.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "numpy==2.4.6",
    "pandas==3.0.5",
    "polars==1.43.2",
    "psycopg[binary,pool]==3.3.4",
    "pyarrow==25.0.0",
    "pydantic==2.13.4",
    "sqlalchemy==2.0.51",
    "structlog==26.1.0",
    "uvicorn==0.52.1",
]

[dependency-groups]
dev = [
    "hypothesis==6.165.2",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["research", "tests"]
pythonpath = ["research", "src"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
warn_unused_configs = true

[tool.uv]
package = false

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
